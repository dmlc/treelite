# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
    args: ["--maxkb=4000"]
- repo: https://github.com/psf/black
  rev: 26.3.1
  hooks:
  - id: black
- repo: https://github.com/pycqa/isort
  rev: 8.0.1
  hooks:
  - id: isort
    args: ["--profile", "black", "--filter-files"]
- repo: https://github.com/MarcoGorelli/cython-lint
  rev: v0.19.0
  hooks:
  - id: cython-lint
  - id: double-quote-cython-strings
- repo: https://github.com/PyCQA/flake8
  rev: 7.3.0
  hooks:
  - id: flake8
    args: [--config=.flake8]
    files: .*$
    types: [file]
    types_or: [python]
    additional_dependencies: [flake8-force]
- repo: https://github.com/pocc/pre-commit-hooks
  rev: v1.3.5
  hooks:
    - id: clang-format
      args: ["-i", "--style=file:.clang-format"]
      language: python
      additional_dependencies: [clang-format>=22.0]
      types_or: [c++]
    - id: cpplint
      language: python
      args: [
        "--linelength=100", "--recursive",
        "--filter=-build/c++11,-build/include,-build/namespaces_literals,-runtime/references,-build/include_order,+build/include_what_you_use",
        "--root=include"]
      additional_dependencies: [cpplint==1.6.1]
      types_or: [c++]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.19.1
  hooks:
    - id: mypy
      additional_dependencies: [types-setuptools]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.7
  hooks:
    - id: ruff
      args: ["--config", "python/pyproject.toml"]
